[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "spinchain-paper"
version = "2.0.0"
description = "Audited Brownian-dynamics reproduction toolkit for self-propelled worm-like filaments"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==2.1.3", "numba==0.61.2", "h5py==3.13.0", "matplotlib==3.10.1", "PyYAML==6.0.2", "psutil==7.0.0"]
[project.optional-dependencies]
gpu = ["taichi==1.7.4"]
test = ["pytest==8.3.5"]
[project.scripts]
spinchain = "spinchain.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
